<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man Pulse</title>
  <style>
    :root {
      --bg-1: #100d1a;
      --bg-2: #1b2336;
      --panel: rgba(16, 18, 30, 0.9);
      --panel-border: rgba(255, 207, 83, 0.42);
      --text: #eef3ff;
      --muted: #c3cce0;
      --board-dark: #0d172a;
      --board-light: #16263d;
      --accent: #facc15;
      --accent-strong: #f59e0b;
      --danger: #ef4444;
      --ghost-red: #fb7185;
      --ghost-pink: #f9a8d4;
      --ghost-cyan: #67e8f9;
      --ghost-orange: #fdba74;
      --wall: #b88912;
      --shadow: rgba(15, 23, 42, 0.8);
    }

    body.light-mode {
      --bg-1: #f8f4ed;
      --bg-2: #e1eadb;
      --panel: rgba(255, 255, 255, 0.96);
      --panel-border: rgba(77, 101, 66, 0.38);
      --text: #1c2b24;
      --muted: #536a60;
      --board-dark: #d9e3d2;
      --board-light: #f5f9f7;
      --accent: #f59e0b;
      --accent-strong: #2f7c6d;
      --danger: #c63d3d;
      --ghost-red: #d91d4c;
      --ghost-pink: #e879f9;
      --ghost-cyan: #2dd4bf;
      --ghost-orange: #f97316;
      --wall: #f2d34e;
      --shadow: rgba(31, 40, 35, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(circle at top, rgba(250, 204, 21, 0.12), transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background 0.25s ease, color 0.25s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-shell {
      width: min(100%, 860px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .home-link {
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      transition: color 0.2s ease;
    }

    .home-link:hover {
      color: var(--text);
    }

    .toggle-button,
    .mini-button,
    .dpad button {
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .toggle-button {
      padding: 0.7rem 1rem;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    .toggle-button:hover,
    .mini-button:hover {
      transform: translateY(-1px);
      border-color: rgba(250, 204, 21, 0.75);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
    }

    .dpad button:hover {
      border-color: rgba(250, 204, 21, 0.75);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
    }

    .game-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 26px;
      padding: 22px 18px 18px;
      box-shadow: 0 30px 60px var(--shadow);
      backdrop-filter: blur(12px);
    }

    .game-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 18px;
    }

    .eyebrow {
      display: inline-block;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.68rem;
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .scoreboard {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .score-pill {
      min-width: 108px;
      padding: 0.7rem 0.9rem;
      border-radius: 16px;
      background: rgba(250, 204, 21, 0.08);
      border: 1px solid rgba(250, 204, 21, 0.4);
      text-align: center;
    }

    .score-pill span {
      display: block;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .score-pill strong {
      font-size: 1.5rem;
      letter-spacing: -0.04em;
    }

    .board-shell {
      position: relative;
      max-width: 440px;
      margin: 0 auto;
      border-radius: 22px;
      padding: 12px;
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
      border: 2px solid rgba(32, 29, 26, 0.68);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.18), 0 16px 28px rgba(17, 24, 39, 0.18);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 16px;
      background: var(--board-dark);
      border: none;
      box-shadow: inset 0 0 0 3px rgba(17, 24, 39, 0.15), 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .overlay {
      position: absolute;
      inset: 12px;
      display: grid;
      place-items: center;
      background: rgba(9, 12, 18, 0.18);
      border-radius: 16px;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.2s ease;
    }

    body.light-mode .overlay {
      background: rgba(255, 255, 255, 0.22);
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: min(80%, 260px);
      padding: 1.1rem 1rem;
      border-radius: 18px;
      background: rgba(15, 19, 31, 0.88);
      border: 1px solid rgba(250, 204, 21, 0.45);
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    body.light-mode .overlay-card {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(108, 92, 72, 0.35);
      box-shadow: 0 18px 40px rgba(82, 67, 55, 0.12);
    }

    .overlay-card p {
      color: var(--muted);
      letter-spacing: 0.14em;
      font-size: 0.68rem;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .overlay-card h2 {
      margin-bottom: 0.85rem;
      font-size: 1.8rem;
      letter-spacing: -0.04em;
    }

    .mini-button {
      padding: 0.7rem 1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #f9fafb;
      border: 0;
      font-weight: 700;
    }

    body.light-mode .mini-button {
      background: linear-gradient(135deg, #f4cf45, #fffbea);
      color: #5a4611;
    }

    .control-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .mini-button {
      min-width: 120px;
    }

    .controls {
      display: flex;
      justify-content: center;
    }

    .dpad {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
    }

    .dpad button {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 1.5rem;
      background: linear-gradient(145deg, rgba(250, 204, 21, 0.15), rgba(240, 180, 0, 0.12));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    .dpad .up { top: 0; left: 50%; transform: translateX(-50%); }
    .dpad .down { bottom: 0; left: 50%; transform: translateX(-50%); }
    .dpad .left { left: 0; top: 50%; transform: translateY(-50%); }
    .dpad .right { right: 0; top: 50%; transform: translateY(-50%); }

    @media (max-width: 620px) {
      .game-meta {
        flex-direction: column;
        align-items: flex-start;
      }

      .scoreboard {
        justify-content: flex-start;
      }

      .game-card {
        padding-left: 12px;
        padding-right: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a href="/" class="home-link">← Home</a>
      <button id="themeToggle" class="toggle-button" type="button">Light board</button>
    </header>

    <main class="game-card">
      <div class="game-meta">
        <div>
          <span class="eyebrow">Arcade maze</span>
          <h1>Pac-Man Pulse</h1>
        </div>

        <div class="scoreboard">
          <div class="score-pill">
            <span>Score</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="score-pill">
            <span>Best</span>
            <strong id="highScore">0</strong>
          </div>
          <div class="score-pill">
            <span>Lives</span>
            <strong id="livesValue">3</strong>
          </div>
        </div>
      </div>

      <div class="board-shell">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <p>Maze status</p>
            <h2 id="overlayTitle">Ready</h2>
            <button id="startBtn" class="mini-button" type="button">Start game</button>
          </div>
        </div>
      </div>

      <div class="control-bar">
        <button id="pauseBtn" class="mini-button" type="button">Pause</button>
        <button id="restartBtn" class="mini-button" type="button">Restart</button>
      </div>

      <div class="controls">
        <div class="dpad" aria-label="Game controls">
          <button class="up" data-dir="ArrowUp" type="button" aria-label="Move up">▲</button>
          <button class="left" data-dir="ArrowLeft" type="button" aria-label="Move left">◀</button>
          <button class="right" data-dir="ArrowRight" type="button" aria-label="Move right">▶</button>
          <button class="down" data-dir="ArrowDown" type="button" aria-label="Move down">▼</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const scoreValue = document.getElementById('scoreValue');
    const highScoreEl = document.getElementById('highScore');
    const livesValue = document.getElementById('livesValue');
    const themeToggle = document.getElementById('themeToggle');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    const rawLevelLayout = [
      '####################',
      '#o.###..####..###.o#',
      '#.......#..........#',
      '#.#######.########.#',
      '#.......#..#.......#',
      '#.#...#......#.#.#.#',
      '#.####...#..#..#.#.#',
      '#...#...####...#...#',
      '#.#.#.##...#.#.#.#.#',
      '#......#...#.......#',
      '#.#.#..#...#.#.#.#.#',
      '#.#.#.##...#...#.#.#',
      '#...#..##.##.#.#...#',
      '#.#.##.........#.#.#',
      '#.#.##.##.#.##.#.#.#',
      '#..................#',
      '#.#######.########.#',
      '#.......#..........#',
      '#o.###..####..###.o#',
      '####################'
    ];

    const levelLayout = rawLevelLayout;
    const ghostGate = { x: 9, y: 12 };
    const ghostBoxExteriorBlocks = new Set(['7,7']);
    const ghostBoxArea = new Set([
      '8,8', '9,8', '10,8',
      '8,9', '9,9', '10,9',
      '8,10', '9,10', '10,10',
      '8,11', '9,11', '10,11'
    ]);
    const ghostBoxBoundary = new Set([
      '7,8', '7,9', '7,10', '7,11', '7,12',
      '8,7', '9,7', '10,7', '11,7',
      '11,8', '11,9', '11,10', '11,11', '11,12',
      '8,12', '10,12'
    ]);
    const playerSpawn = { x: 9, y: 5 };
    const ghostSpawnPositions = [
      { x: 9, y: 9 },
      { x: 10, y: 9 },
      { x: 9, y: 10 },
      { x: 10, y: 10 }
    ];

    const ghostColors = ['#fb7185', '#67e8f9', '#f9a8d4', '#fdba74'];
    let highScore = 0;
    let score = 0;
    let lives = 3;
    let isRunning = false;
    let isPaused = false;
    let lastFrameTime = 0;
    let moveInterval = 180;
    let powerModeUntil = 0;
    let player;
    let playerDirection;
    let nextDirection;
    let ghosts;
    let pellets;
    let powerPellets;
    let ghostReleaseIndex = 0;
    let ghostReleaseTimer = 0;

    function keyFromPos(x, y) {
      return `${x},${y}`;
    }

    function getBoardColors() {
      const rootStyles = getComputedStyle(document.body);
      return {
        dark: rootStyles.getPropertyValue('--board-dark').trim(),
        light: rootStyles.getPropertyValue('--board-light').trim(),
        wall: rootStyles.getPropertyValue('--wall').trim()
      };
    }

    function setupBoard() {
      pellets = new Set();
      powerPellets = new Set();
      for (let y = 0; y < levelLayout.length; y++) {
        for (let x = 0; x < levelLayout[y].length; x++) {
          const cell = keyFromPos(x, y);
          if (ghostBoxArea.has(cell)) {
            continue;
          }
          if (isWall(x, y)) {
            continue;
          }
          const char = levelLayout[y][x];
          if (char === '.') {
            pellets.add(cell);
          }
          if (char === 'o') {
            powerPellets.add(cell);
          }
        }
      }
    }

    function createGhost(x, y, color, personality = 'chaser') {
      return {
        x,
        y,
        color,
        dx: 0,
        dy: 0,
        home: { x, y },
        personality,
        hasExitedPen: false,
        speedBoost: Math.random() * 0.8 + 0.6
      };
    }

    function rebuildLevel() {
      setupBoard();
      player = { ...playerSpawn };
      playerDirection = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      ghosts = ghostSpawnPositions.map((pos, index) => {
        const personalities = ['blinky', 'pinky', 'inky', 'clyde'];
        return {
          ...createGhost(pos.x, pos.y, ghostColors[index], personalities[index]),
          releaseOrder: index
        };
      });
      ghostReleaseIndex = 0;
      ghostReleaseTimer = 1200;
      powerModeUntil = 0;
      isPaused = false;
      lastFrameTime = 0;
      drawGame();
      updateScore();
    }

    function respawnGhosts() {
      ghosts = ghostSpawnPositions.map((pos, index) => {
        const personalities = ['blinky', 'pinky', 'inky', 'clyde'];
        return {
          ...createGhost(pos.x, pos.y, ghostColors[index], personalities[index]),
          releaseOrder: index
        };
      });
      ghostReleaseIndex = 0;
      ghostReleaseTimer = 1200;
    }

    function updateScore() {
      scoreValue.textContent = score;
      highScoreEl.textContent = highScore;
      livesValue.textContent = lives;
    }

    function isWall(x, y) {
      if (x < 0 || y < 0 || x >= tileCount || y >= tileCount) {
        return true;
      }
      const cell = keyFromPos(x, y);
      if (ghostBoxExteriorBlocks.has(cell)) {
        return true;
      }
      if (ghostBoxArea.has(cell) || cell === keyFromPos(ghostGate.x, ghostGate.y) || ghostBoxBoundary.has(cell)) {
        return true;
      }
      const row = levelLayout[y];
      if (!row) {
        return true;
      }
      return row[x] === '#';
    }

    function isGhostWall(x, y, ghost) {
      if (x < 0 || y < 0 || x >= tileCount || y >= tileCount) {
        return true;
      }
      const cell = keyFromPos(x, y);
      if (ghostBoxExteriorBlocks.has(cell) || ghostBoxBoundary.has(cell)) {
        return true;
      }
      if (x === ghostGate.x && y === ghostGate.y) {
        return ghost.hasExitedPen || ghost.releaseOrder >= ghostReleaseIndex;
      }
      if (ghostBoxArea.has(cell)) {
        return ghost.hasExitedPen;
      }
      const row = levelLayout[y];
      return !row || row[x] === '#';
    }

    function isGhostGateOpen() {
      return ghosts.some(ghost => ghost.releaseOrder < ghostReleaseIndex && !ghost.hasExitedPen);
    }

    function isValidMove(x, y) {
      return !isWall(x, y);
    }

    function setDirection(key) {
      const moveMap = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }
      };

      const next = moveMap[key];
      if (!next) return;

      if (isValidMove(player.x + next.x, player.y + next.y)) {
        nextDirection = next;
      }

      if (!isRunning && !isPaused) {
        startGame();
      }
    }

    function startGame() {
      if (overlayTitle.textContent === 'Game over') {
        return;
      }

      if (isPaused) {
        isPaused = false;
        pauseBtn.textContent = 'Pause';
        overlay.classList.add('hidden');
        overlayTitle.textContent = 'Running';
        startBtn.textContent = 'Start game';
        lastFrameTime = 0;
        return;
      }

      if (!isRunning) {
        isRunning = true;
        overlay.classList.add('hidden');
        overlayTitle.textContent = 'Running';
      }

      lastFrameTime = 0;
    }

    function beginFreshGame() {
      score = 0;
      lives = 3;
      rebuildLevel();
      overlay.classList.add('hidden');
      overlayTitle.textContent = 'Running';
      isRunning = true;
      pauseBtn.textContent = 'Pause';
      startBtn.textContent = 'Start game';
      lastFrameTime = 0;
    }

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Continue game' : 'Pause';

      if (isPaused) {
        overlay.classList.remove('hidden');
        overlayTitle.textContent = 'Paused';
        startBtn.textContent = 'Continue game';
      } else {
        overlay.classList.add('hidden');
        overlayTitle.textContent = 'Running';
        startBtn.textContent = 'Start game';
      }
    }

    function endGame() {
      isRunning = false;
      isPaused = false;
      overlay.classList.remove('hidden');
      overlayTitle.textContent = 'Game over';
      startBtn.textContent = 'Restart game';
      pauseBtn.textContent = 'Pause';
      drawGame();
    }

    function maybeUpdateHighScore() {
      highScore = Number(localStorage.getItem('pacmanHighScore')) || 0;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('pacmanHighScore', String(highScore));
      }
      updateScore();
    }

    function handlePlayerMovement() {
      playerDirection = nextDirection;
      const nextX = player.x + playerDirection.x;
      const nextY = player.y + playerDirection.y;

      if (isValidMove(nextX, nextY)) {
        player.x = nextX;
        player.y = nextY;
      }

      const pelletKey = keyFromPos(player.x, player.y);
      if (pellets.has(pelletKey)) {
        pellets.delete(pelletKey);
        score += 10;
      }

      if (powerPellets.has(pelletKey)) {
        powerPellets.delete(pelletKey);
        score += 20;
        powerModeUntil = performance.now() + 5000;
      }

      maybeUpdateHighScore();

      if (pellets.size === 0 && powerPellets.size === 0) {
        isRunning = false;
        overlay.classList.remove('hidden');
        overlayTitle.textContent = 'You win!';
        startBtn.textContent = 'Play again';
        pauseBtn.textContent = 'Pause';
      }
    }

    function ghostDistance(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    function getOccupiedGhostTiles(excludedGhost = null) {
      const occupied = new Set();
      ghosts.forEach((ghost) => {
        if (ghost !== excludedGhost) {
          occupied.add(keyFromPos(ghost.x, ghost.y));
        }
      });
      return occupied;
    }

    function getGhostTarget(ghost) {
      const ahead = (tiles) => ({
        x: player.x + playerDirection.x * tiles,
        y: player.y + playerDirection.y * tiles
      });

      if (ghost.personality === 'pinky') {
        return ahead(4);
      }

      if (ghost.personality === 'inky') {
        const blinky = ghosts.find(candidate => candidate.personality === 'blinky');
        const pivot = ahead(2);
        return blinky
          ? { x: pivot.x * 2 - blinky.x, y: pivot.y * 2 - blinky.y }
          : pivot;
      }

      if (ghost.personality === 'clyde' && ghostDistance(ghost, player) <= 6) {
        return { x: 1, y: 18 };
      }

      return { x: player.x, y: player.y };
    }

    function getGhostFleeTarget(ghost) {
      const playerDistances = getGhostDistancesFrom(player);
      let fleeTarget = ghost;
      let greatestDistance = -1;
      let closestToGhost = Infinity;

      playerDistances.forEach((distance, key) => {
        if (ghostBoxArea.has(key)) return;
        const [x, y] = key.split(',').map(Number);
        const distanceFromGhost = ghostDistance(ghost, { x, y });
        if (distance > greatestDistance || (distance === greatestDistance && distanceFromGhost < closestToGhost)) {
          fleeTarget = { x, y };
          greatestDistance = distance;
          closestToGhost = distanceFromGhost;
        }
      });

      return fleeTarget;
    }

    function getGhostDistancesFrom(target, ghost = null) {
      const wallAt = (x, y) => ghost ? isGhostWall(x, y, ghost) : isWall(x, y);
      const walkableTiles = [];
      for (let y = 0; y < tileCount; y++) {
        for (let x = 0; x < tileCount; x++) {
          if (!wallAt(x, y)) {
            walkableTiles.push({ x, y });
          }
        }
      }

      const destination = walkableTiles.reduce((closest, tile) => {
        const distance = ghostDistance(tile, target);
        return distance < closest.distance ? { tile, distance } : closest;
      }, { tile: walkableTiles[0], distance: Infinity }).tile;
      const distances = new Map([[keyFromPos(destination.x, destination.y), 0]]);
      const queue = [destination];

      for (let index = 0; index < queue.length; index++) {
        const tile = queue[index];
        const nextDistance = distances.get(keyFromPos(tile.x, tile.y)) + 1;
        for (const dir of [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }]) {
          const x = tile.x + dir.x;
          const y = tile.y + dir.y;
          const key = keyFromPos(x, y);
          if (wallAt(x, y) || distances.has(key)) continue;
          distances.set(key, nextDistance);
          queue.push({ x, y });
        }
      }

      return distances;
    }

    function pickGhostDirection(ghost) {
      const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
      const occupiedTiles = getOccupiedGhostTiles(ghost);
      const frightened = powerModeUntil > performance.now();
      const reverseDir = { x: -ghost.dx, y: -ghost.dy };
      const target = frightened ? getGhostFleeTarget(ghost) : getGhostTarget(ghost);
      const distances = getGhostDistancesFrom(target, ghost);

      const validMoves = [];
      dirs.forEach((dir) => {
        const nx = ghost.x + dir.x;
        const ny = ghost.y + dir.y;
        const nextTile = keyFromPos(nx, ny);

        if (isGhostWall(nx, ny, ghost)) return;
        if (occupiedTiles.has(nextTile)) return;

        const isReverse = dir.x === reverseDir.x && dir.y === reverseDir.y;
        validMoves.push({
          dir,
          distance: distances.get(nextTile) ?? Infinity,
          isReverse,
          continues: dir.x === ghost.dx && dir.y === ghost.dy
        });
      });

      if (!validMoves.length) {
        const fallback = dirs.find(dir => {
          const nx = ghost.x + dir.x;
          const ny = ghost.y + dir.y;
          return !isGhostWall(nx, ny, ghost) && !occupiedTiles.has(keyFromPos(nx, ny));
        });
        return fallback || { x: 0, y: 0 };
      }

      const forwardMoves = validMoves.filter(move => !move.isReverse);
      const candidates = forwardMoves.length ? forwardMoves : validMoves;
      candidates.sort((a, b) => {
        return a.distance - b.distance || Number(b.continues) - Number(a.continues);
      });
      return candidates[0].dir;
    }

    function updateGhosts() {
      const ghostOrder = [...ghosts].sort((a, b) => a.releaseOrder - b.releaseOrder);
      const occupiedTiles = new Set(ghosts.map((ghost) => keyFromPos(ghost.x, ghost.y)));

      ghostOrder.forEach((ghost) => {
        const next = pickGhostDirection(ghost);
        if (!next || (!next.x && !next.y)) return;

        const nx = ghost.x + next.x;
        const ny = ghost.y + next.y;
        const nextKey = keyFromPos(nx, ny);
        const wasInPen = ghostBoxArea.has(keyFromPos(ghost.x, ghost.y)) || (ghost.x === ghostGate.x && ghost.y === ghostGate.y);

        if (isGhostWall(nx, ny, ghost)) return;
        if (occupiedTiles.has(nextKey) && nextKey !== keyFromPos(ghost.x, ghost.y)) return;

        occupiedTiles.delete(keyFromPos(ghost.x, ghost.y));
        occupiedTiles.add(nextKey);

        ghost.x = nx;
        ghost.y = ny;
        if (wasInPen && !ghostBoxArea.has(nextKey) && !(nx === ghostGate.x && ny === ghostGate.y)) {
          ghost.hasExitedPen = true;
        }

        ghost.dx = next.x;
        ghost.dy = next.y;
      });
    }

    function checkGhostCollisions() {
      const frightened = powerModeUntil > performance.now();
      for (const ghost of ghosts) {
        if (ghost.x === player.x && ghost.y === player.y) {
          if (frightened) {
            ghost.x = ghost.home.x;
            ghost.y = ghost.home.y;
            ghost.hasExitedPen = false;
            score += 50;
            maybeUpdateHighScore();
          } else {
            lives -= 1;
            updateScore();
            if (lives <= 0) {
              endGame();
            } else {
              player = { ...playerSpawn };
              playerDirection = { x: 1, y: 0 };
              nextDirection = { x: 1, y: 0 };
              respawnGhosts();
            }
            return true;
          }
          return true;
        }
      }
      return false;
    }

    function updateGhostRelease() {
      if (ghostReleaseIndex >= ghosts.length) {
        return;
      }

      ghostReleaseTimer -= 180;
      if (ghostReleaseTimer <= 0) {
        ghostReleaseIndex += 1;
        ghostReleaseTimer = 1200;
      }
    }

    function updateGame() {
      if (!isRunning || isPaused) return;

      updateGhostRelease();
      handlePlayerMovement();
      if (!isRunning || checkGhostCollisions()) {
        drawGame();
        return;
      }
      updateGhosts();
      checkGhostCollisions();
      drawGame();
    }

    function drawCheckerboard() {
      const { dark } = getBoardColors();
      ctx.fillStyle = dark;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawWall(x, y) {
      const { wall } = getBoardColors();
      ctx.fillStyle = wall;
      ctx.fillRect(x * gridSize + 1, y * gridSize + 1, gridSize - 2, gridSize - 2);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(x * gridSize + 2, y * gridSize + 2, gridSize - 6, 4);
    }

    function drawGhostGate() {
      const { dark, wall } = getBoardColors();
      const left = ghostGate.x * gridSize;
      const top = ghostGate.y * gridSize;
      ctx.fillStyle = dark;
      ctx.fillRect(left + 1, top + 1, gridSize - 2, gridSize - 2);
      ctx.strokeStyle = wall;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const barRows = isGhostGateOpen() ? [3, 7, 11] : [5, 10, 15];
      barRows.forEach(offset => {
        ctx.moveTo(left + 4, top + offset);
        ctx.lineTo(left + gridSize - 4, top + offset);
      });
      ctx.stroke();
    }

    function drawPellets() {
      pellets.forEach((coord) => {
        const [x, y] = coord.split(',').map(Number);
        ctx.beginPath();
        ctx.fillStyle = '#f8fafc';
        ctx.arc(x * gridSize + gridSize / 2, y * gridSize + gridSize / 2, 2.8, 0, Math.PI * 2);
        ctx.fill();
      });

      powerPellets.forEach((coord) => {
        const [x, y] = coord.split(',').map(Number);
        ctx.beginPath();
        ctx.fillStyle = '#fbbf24';
        ctx.shadowColor = 'rgba(251, 191, 36, 0.9)';
        ctx.shadowBlur = 15;
        ctx.arc(x * gridSize + gridSize / 2, y * gridSize + gridSize / 2, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    function drawPlayer() {
      const px = player.x * gridSize + gridSize / 2;
      const py = player.y * gridSize + gridSize / 2;
      const mouthAngle = 0.2 + (Math.sin(Date.now() / 100) + 1) * 0.25;

      ctx.beginPath();
      ctx.fillStyle = '#facc15';
      ctx.moveTo(px, py);
      ctx.arc(px, py, gridSize * 0.38, playerDirection.x === 1 ? -0.2 : playerDirection.x === -1 ? Math.PI - 0.2 : playerDirection.y === 1 ? Math.PI * 0.5 - 0.2 : -Math.PI * 0.5 - 0.2, playerDirection.x === 1 ? 0.2 : playerDirection.x === -1 ? Math.PI + 0.2 : playerDirection.y === 1 ? Math.PI * 0.5 + 0.2 : -Math.PI * 0.5 + 0.2, true);
      ctx.closePath();
      ctx.fill();
    }

    function drawGhost(ghost) {
      const px = ghost.x * gridSize + gridSize / 2;
      const py = ghost.y * gridSize + gridSize / 2;
      const frightened = powerModeUntil > performance.now();

      ctx.beginPath();
      ctx.moveTo(px - 10, py + 10);
      ctx.lineTo(px - 10, py - 8);
      ctx.quadraticCurveTo(px - 10, py - 14, px - 4, py - 14);
      ctx.lineTo(px - 2, py - 6);
      ctx.lineTo(px + 2, py - 14);
      ctx.quadraticCurveTo(px + 10, py - 14, px + 10, py - 8);
      ctx.lineTo(px + 10, py + 10);
      ctx.lineTo(px + 6, py + 4);
      ctx.lineTo(px + 2, py + 10);
      ctx.lineTo(px - 2, py + 10);
      ctx.lineTo(px - 6, py + 4);
      ctx.closePath();
      ctx.fillStyle = frightened ? '#cbd5e1' : ghost.color;
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(px - 5, py - 2, 3, 0, Math.PI * 2);
      ctx.arc(px + 5, py - 2, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(px - 5, py - 2, 1.5, 0, Math.PI * 2);
      ctx.arc(px + 5, py - 2, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCheckerboard();

      for (let y = 0; y < levelLayout.length; y++) {
        for (let x = 0; x < levelLayout[y].length; x++) {
          const cell = keyFromPos(x, y);
          if (x === ghostGate.x && y === ghostGate.y) continue;
          if (isWall(x, y) && (!ghostBoxArea.has(cell) || ghostBoxExteriorBlocks.has(cell))) {
            drawWall(x, y);
          }
        }
      }

      drawGhostGate();
      drawPellets();
      drawPlayer();
      ghosts.forEach(drawGhost);
    }

    function gameLoop(timestamp) {
      if (lastFrameTime === 0) lastFrameTime = timestamp;
      const elapsed = timestamp - lastFrameTime;

      if (elapsed >= moveInterval) {
        lastFrameTime = timestamp;
        updateGame();
      }

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === ' ') {
        event.preventDefault();
        if (!isRunning) {
          startGame();
        } else if (isPaused) {
          togglePause();
        } else {
          togglePause();
        }
        return;
      }

      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
        event.preventDefault();
        setDirection(event.key);
      }
    });

    document.querySelectorAll('.dpad button').forEach((button) => {
      const dir = button.dataset.dir;
      button.addEventListener('click', () => setDirection(dir));
      button.addEventListener('touchstart', (event) => {
        event.preventDefault();
        setDirection(dir);
      });
    });

    startBtn.addEventListener('click', () => {
      if (overlayTitle.textContent === 'Game over' || overlayTitle.textContent === 'You win!') {
        beginFreshGame();
        return;
      }

      if (overlayTitle.textContent === 'Paused') {
        togglePause();
        return;
      }

      startGame();
    });

    pauseBtn.addEventListener('click', () => {
      if (!isRunning) return;
      togglePause();
    });

    restartBtn.addEventListener('click', () => {
      beginFreshGame();
    });

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      themeToggle.textContent = document.body.classList.contains('light-mode') ? 'Dark board' : 'Light board';
      drawGame();
    });

    highScore = Number(localStorage.getItem('pacmanHighScore')) || 0;
    updateScore();
    rebuildLevel();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
