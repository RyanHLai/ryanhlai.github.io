<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <style>
    :root {
      --bg-deep: #0e1726;
      --bg-mid: #1c2a3a;
      --panel: rgba(17, 24, 39, 0.88);
      --panel-border: rgba(148, 163, 184, 0.45);
      --board-shadow: rgba(15, 23, 42, 0.7);
      --light-tile: #e8efe5;
      --dark-tile: #7a8f7a;
      --light-tile-alt: #dcead9;
      --dark-tile-alt: #697d68;
      --accent-green: #7dd3a7;
      --accent-gold: #facc15;
      --accent-red: #ef4444;
      --accent-blue: #60a5fa;
      --accent-purple: #c084fc;
      --accent-cyan: #67e8f9;
      --text: #edf2ff;
      --muted: #cbd5e1;
      --shadow: rgba(15, 23, 42, 0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      background:
        radial-gradient(circle at top, rgba(125, 211, 167, 0.18), transparent 25%),
        linear-gradient(135deg, var(--bg-deep), var(--bg-mid) 50%, #101827);
      color: var(--text);
      font-family: Arial, sans-serif;
      letter-spacing: 0.02em;
    }

    .nav {
      width: min(100%, 460px);
      margin-bottom: 12px;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: color 0.2s ease;
    }

    .nav a:hover { color: var(--accent-green); }

    .game-panel {
      width: min(100%, 520px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 18px 48px var(--shadow);
      padding: 18px 18px 20px;
      backdrop-filter: blur(8px);
    }

    h1 {
      margin-bottom: 18px;
      text-align: center;
      font-size: clamp(2rem, 4vw, 2.6rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f8fafc;
      text-shadow: 0 0 20px rgba(125, 211, 167, 0.4);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(31, 41, 55, 0.95), rgba(15, 23, 42, 0.85));
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      font-size: 16px;
      font-weight: 700;
    }

    .toolbar .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 90px;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(125, 211, 167, 0.25);
      color: var(--text);
    }

    .toolbar button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, #facc15, #eab308);
      color: #111827;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(250, 204, 21, 0.25);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .toolbar button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(250, 204, 21, 0.34);
    }

    .board-wrap {
      display: flex;
      justify-content: center;
      max-width: 100%;
      padding: 16px;
      background: linear-gradient(180deg, #111827, #1f2937);
      border: 2px solid rgba(148, 163, 184, 0.32);
      border-radius: 16px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.04), 0 12px 25px rgba(15, 23, 42, 0.45);
    }

    .difficulty-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .difficulty-btn {
      padding: 8px 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.6);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .difficulty-btn.active {
      background: linear-gradient(180deg, #7dd3a7, #34d399);
      color: #0f172a;
      border-color: rgba(110, 231, 183, 0.8);
      box-shadow: 0 8px 18px rgba(52, 211, 153, 0.26);
    }

    .board {
      display: grid;
      grid-gap: 4px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.8);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.28);
    }

    .cell {
      width: var(--cell-size, 34px);
      height: var(--cell-size, 34px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(15, 23, 42, 0.25);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), inset 0 -2px 0 rgba(15, 23, 42, 0.08);
      transition: transform 0.08s ease, filter 0.15s ease;
    }

    .cell.light {
      background: linear-gradient(135deg, var(--light-tile-alt), var(--light-tile));
      color: #0f172a;
    }

    .cell.dark {
      background: linear-gradient(135deg, var(--dark-tile-alt), var(--dark-tile));
      color: #f8fafc;
    }

    .cell:hover:not(.revealed) {
      transform: translateY(-1px) scale(1.02);
      filter: brightness(1.05);
    }

    .cell.revealed {
      cursor: default;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.18);
    }

    .cell.revealed.light,
    .cell.revealed.dark {
      background: linear-gradient(135deg, rgba(226, 232, 240, 0.9), rgba(148, 163, 184, 0.7));
      border-color: rgba(71, 85, 105, 0.35);
    }

    .cell.mine {
      background: linear-gradient(135deg, #f87171, #dc2626);
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 0 12px rgba(239,68,68,0.4);
    }

    .cell.flagged {
      position: relative;
      background: linear-gradient(135deg, #fef3c7, #facc15);
      color: #0f172a;
    }

    .cell.flagged::after {
      content: "⚑";
      font-size: 16px;
    }

    .cell[data-num="1"] { color: #60a5fa; }
    .cell[data-num="2"] { color: #4ade80; }
    .cell[data-num="3"] { color: #f87171; }
    .cell[data-num="4"] { color: #c084fc; }
    .cell[data-num="5"] { color: #f59e0b; }
    .cell[data-num="6"] { color: #67e8f9; }
    .cell[data-num="7"] { color: #1f2937; }
    .cell[data-num="8"] { color: #334155; }

    #status {
      margin-top: 16px;
      min-height: 28px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent-green);
    }
  </style>
</head>
<body>
  <div class="nav"><a href="/">&larr; Home</a></div>

  <div class="game-panel">
    <h1>Minesweeper</h1>

    <div class="toolbar">
      <span class="pill" id="mineCounter">&#x1F4A3; 15</span>
      <button id="newGameBtn">New Game</button>
      <span class="pill" id="timerDisplay">&#x23F1; 0s</span>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="difficulty-controls" aria-label="Difficulty selector">
      <button class="difficulty-btn" type="button" data-difficulty="easy">Easy</button>
      <button class="difficulty-btn active" type="button" data-difficulty="medium">Medium</button>
      <button class="difficulty-btn" type="button" data-difficulty="hard">Hard</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    var difficultyLevels = {
      easy: { size: 8, mines: 10, cellSize: 42 },
      medium: { size: 10, mines: 15, cellSize: 34 },
      hard: { size: 12, mines: 24, cellSize: 26 }
    };

    var currentDifficulty = "medium";
    var BOARD_SIZE = difficultyLevels[currentDifficulty].size;
    var MINE_COUNT = difficultyLevels[currentDifficulty].mines;
    var CELL_SIZE = difficultyLevels[currentDifficulty].cellSize;

    var grid = [];
    var revealedCount = 0;
    var flagCount = 0;
    var gameActive = false;
    var timerInterval = null;
    var seconds = 0;

    function setDifficulty(level) {
      currentDifficulty = level;
      BOARD_SIZE = difficultyLevels[level].size;
      MINE_COUNT = difficultyLevels[level].mines;
      CELL_SIZE = difficultyLevels[level].cellSize;
      document.querySelectorAll(".difficulty-btn").forEach(function (button) {
        button.classList.toggle("active", button.dataset.difficulty === level);
      });
      init();
    }

    function init() {
      grid = [];
      revealedCount = 0;
      flagCount = 0;
      gameActive = true;
      seconds = 0;
      clearInterval(timerInterval);
      document.getElementById("timerDisplay").textContent = "\u23F1 0s";
      document.getElementById("mineCounter").textContent = "\uD83D\uDCA3 " + MINE_COUNT;
      document.getElementById("status").textContent = "";

      var boardEl = document.getElementById("board");
      boardEl.innerHTML = "";
      boardEl.style.setProperty("--cell-size", CELL_SIZE + "px");
      boardEl.style.gridTemplateColumns = "repeat(" + BOARD_SIZE + ", " + CELL_SIZE + "px)";

      // Create grid data
      for (var r = 0; r < BOARD_SIZE; r++) {
        grid[r] = [];
        for (var c = 0; c < BOARD_SIZE; c++) {
          grid[r][c] = { mine: false, revealed: false, flagged: false, adjacentMines: 0 };
        }
      }

      // Place mines randomly
      var placed = 0;
      while (placed < MINE_COUNT) {
        var mr = Math.floor(Math.random() * BOARD_SIZE);
        var mc = Math.floor(Math.random() * BOARD_SIZE);
        if (!grid[mr][mc].mine) {
          grid[mr][mc].mine = true;
          placed++;
        }
      }

      // Calculate adjacent mine counts
      for (var r = 0; r < BOARD_SIZE; r++) {
        for (var c = 0; c < BOARD_SIZE; c++) {
          if (grid[r][c].mine) continue;
          var count = 0;
          forEachNeighbor(r, c, function (nr, nc) {
            if (grid[nr][nc].mine) count++;
          });
          grid[r][c].adjacentMines = count;
        }
      }

      // Create cell elements
      for (var r = 0; r < BOARD_SIZE; r++) {
        for (var c = 0; c < BOARD_SIZE; c++) {
          var cell = document.createElement("div");
          cell.className = "cell " + ((r + c) % 2 === 0 ? "light" : "dark");
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.addEventListener("click", handleCellClick);
          cell.addEventListener("contextmenu", handleCellRightClick);
          boardEl.appendChild(cell);
        }
      }

      // Start timer
      timerInterval = setInterval(function () {
        if (gameActive) {
          seconds++;
          document.getElementById("timerDisplay").textContent = "\u23F1 " + seconds + "s";
        }
      }, 1000);
    }

    function forEachNeighbor(r, c, fn) {
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          var nr = r + dr;
          var nc = c + dc;
          if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
            fn(nr, nc);
          }
        }
      }
    }

    function getCellEl(r, c) {
      return document.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"]');
    }

    function handleCellClick(e) {
      var r = parseInt(e.currentTarget.dataset.r);
      var c = parseInt(e.currentTarget.dataset.c);
      reveal(r, c);
    }

    function handleCellRightClick(e) {
      e.preventDefault();
      var r = parseInt(e.currentTarget.dataset.r);
      var c = parseInt(e.currentTarget.dataset.c);
      toggleFlag(r, c);
    }

    function reveal(r, c) {
      if (!gameActive) return;
      var data = grid[r][c];
      if (data.revealed || data.flagged) return;

      data.revealed = true;
      revealedCount++;
      var cell = getCellEl(r, c);
      cell.classList.add("revealed");

      if (data.mine) {
        cell.classList.add("mine");
        cell.textContent = "\uD83D\uDCA3";
        endGame(false);
        return;
      }

      if (data.adjacentMines > 0) {
        cell.textContent = data.adjacentMines;
        cell.dataset.num = data.adjacentMines;
      } else {
        // Flood-fill reveal empty neighbours
        forEachNeighbor(r, c, function (nr, nc) { reveal(nr, nc); });
      }

      if (revealedCount === BOARD_SIZE * BOARD_SIZE - MINE_COUNT) {
        endGame(true);
      }
    }

    function toggleFlag(r, c) {
      if (!gameActive) return;
      var data = grid[r][c];
      if (data.revealed) return;

      data.flagged = !data.flagged;
      var cell = getCellEl(r, c);
      cell.classList.toggle("flagged", data.flagged);
      flagCount += data.flagged ? 1 : -1;
      document.getElementById("mineCounter").textContent = "\uD83D\uDCA3 " + (MINE_COUNT - flagCount);
    }

    function endGame(won) {
      gameActive = false;
      clearInterval(timerInterval);

      // Reveal all mines
      for (var r = 0; r < BOARD_SIZE; r++) {
        for (var c = 0; c < BOARD_SIZE; c++) {
          if (grid[r][c].mine && !grid[r][c].revealed) {
            var cell = getCellEl(r, c);
            cell.classList.add("revealed", "mine");
            cell.textContent = "\uD83D\uDCA3";
          }
        }
      }

      document.getElementById("status").textContent = won
        ? "\uD83C\uDF89 You won in " + seconds + "s!"
        : "\uD83D\uDCA5 Game over!";
    }

    document.getElementById("newGameBtn").addEventListener("click", init);
    document.querySelectorAll(".difficulty-btn").forEach(function (button) {
      button.addEventListener("click", function () {
        setDifficulty(button.dataset.difficulty);
      });
    });
    init();
  </script>
</body>
</html>
