<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        :root {
            color-scheme: dark;
            --page-top: #172326;
            --page-bottom: #10191d;
            --panel: rgba(20, 30, 34, 0.94);
            --panel-raised: #202d31;
            --panel-border: color-mix(in srgb, var(--accent-color) 26%, transparent);
            --text: #f2f5ef;
            --muted: #aebbb4;
            --accent: #a6e4c4;
            --accent-color: #a6e4c4;
            --accent-strong: #62c89a;
            --gold: #f4cb70;
            --danger: #f08d82;
            --board-bg: #10191d;
            --shadow: rgba(2, 9, 11, 0.42);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 18px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(125, 190, 155, 0.16), transparent 42%),
                linear-gradient(145deg, var(--page-top), var(--page-bottom) 72%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            transition: background 0.25s ease, color 0.25s ease;
        }

        body.light-mode {
            color-scheme: light;
            --page-top: #e7eee7;
            --page-bottom: #d5e1d9;
            --panel: rgba(250, 252, 247, 0.96);
            --panel-raised: #e8efe8;
            --panel-border: color-mix(in srgb, var(--accent-color) 30%, transparent);
            --text: #1e2a24;
            --muted: #5d6d62;
            --accent: #357c60;
            --accent-strong: #2c986c;
            --gold: #a76d16;
            --danger: #b94943;
            --board-bg: #e1e9e1;
            --shadow: rgba(33, 57, 41, 0.14);
        }

        .page-shell { width: min(100%, 920px); }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        button {
            min-height: 42px;
            padding: 9px 14px;
            border: 1px solid var(--accent-color);
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.045);
            color: var(--text);
            font: inherit;
            font-size: 0.9rem;
            font-weight: 650;
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
            border-color: var(--accent-color);
            background: color-mix(in srgb, var(--accent-color) 12%, transparent);
        }

        button:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        #backBtn, #themeToggle { min-width: 112px; }
        #backBtn { text-align: left; }

        .game-card {
            padding: 22px;
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            background: var(--panel);
            box-shadow: 0 28px 60px var(--shadow);
            backdrop-filter: blur(10px);
        }

        .game-meta {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 20px;
        }

        .eyebrow, .stat-label, .panel-label {
            color: var(--muted);
            font-size: 0.68rem;
            font-weight: 750;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .eyebrow { display: block; margin-bottom: 6px; }

        h1 {
            margin: 0;
            color: var(--text);
            font-size: 2.35rem;
            line-height: 1;
            letter-spacing: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(84px, 1fr));
            gap: 8px;
        }

        .stat {
            min-width: 0;
            padding: 9px 12px 10px;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            background: rgba(166, 228, 196, 0.055);
            text-align: center;
        }

        .stat-label { display: block; margin-bottom: 3px; font-size: 0.6rem; }
        .stat strong { font-size: 1.25rem; font-variant-numeric: tabular-nums; }

        .game-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 230px;
            align-items: start;
            gap: 18px;
        }

        #gameContainer {
            position: relative;
            width: min(100%, 340px);
            aspect-ratio: 1 / 2;
            margin: 0 auto;
            overflow: hidden;
            border: 2px solid color-mix(in srgb, var(--accent-color) 72%, transparent);
            border-radius: 16px;
            background-color: var(--board-bg);
            background-image:
                linear-gradient(color-mix(in srgb, var(--accent-color) 8%, transparent) 1px, transparent 1px),
                linear-gradient(90deg, color-mix(in srgb, var(--accent-color) 8%, transparent) 1px, transparent 1px);
            background-size: 10% 5%;
            box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.2), 0 16px 30px var(--shadow);
        }

        #gameCanvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .pause-overlay {
            position: absolute;
            z-index: 2;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(8, 14, 16, 0.64);
            backdrop-filter: blur(4px);
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        body.light-mode .pause-overlay { background: rgba(255, 255, 255, 0.64); }

        .pause-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .pause-card {
            width: min(100%, 230px);
            padding: 20px 16px;
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            background: var(--panel);
            text-align: center;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
        }

        .pause-card p {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.66rem;
            font-weight: 750;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .pause-card h2 {
            margin: 0 0 16px;
            font-size: 1.8rem;
        }

        #resumeBtn {
            width: 100%;
            border-color: var(--accent-color);
            background: color-mix(in srgb, var(--accent-color) 18%, var(--panel-raised));
            color: var(--text);
        }

        .sidebar { display: grid; gap: 12px; }

        .side-panel {
            padding: 14px;
            border: 1px solid var(--panel-border);
            border-radius: 13px;
            background: var(--panel-raised);
        }

        .panel-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .panel-heading h2 {
            margin: 0;
            color: var(--text);
            font-size: 0.93rem;
            letter-spacing: 0;
        }

        .panel-label { color: var(--accent-color); font-size: 0.58rem; }

        #nextCanvas {
            display: block;
            width: 100%;
            height: 96px;
            border-radius: 9px;
            background: var(--board-bg);
        }

        .controls p {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.83rem;
        }

        .controls kbd {
            padding: 2px 6px;
            border: 1px solid var(--panel-border);
            border-radius: 5px;
            color: var(--text);
            font: inherit;
            font-size: 0.72rem;
            white-space: nowrap;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 18px 0 0;
        }

        .action-bar button { min-width: 104px; }
        #pauseBtn {
            border-color: var(--accent-color);
            background: color-mix(in srgb, var(--accent-color) 18%, var(--panel-raised));
            color: var(--text);
        }
        #testBtn { color: var(--muted); }

        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            width: min(100%, 420px);
            margin: 14px auto 0;
        }

        .mobile-controls button {
            display: flex;
            min-height: 58px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
            padding: 6px;
            touch-action: none;
        }

        .mobile-controls button span { font-size: 1.05rem; }
        .mobile-controls button small { color: var(--muted); font-size: 0.65rem; }
        .mobile-controls button:active { transform: scale(0.97); }

        #testResults {
            display: none;
            position: fixed;
            z-index: 10;
            top: 50%;
            left: 50%;
            width: min(calc(100% - 32px), 560px);
            max-height: 80vh;
            overflow-y: auto;
            padding: 22px;
            transform: translate(-50%, -50%);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            background: var(--panel);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
        }

        #testResults h2 { margin: 0 0 14px; font-size: 1.2rem; }
        #testResults .pass { color: var(--accent); }
        #testResults .fail { color: var(--danger); }
        #testResults .summary { margin: 16px 0; }

        @media (min-width: 700px) {
            .mobile-controls { display: none; }
        }

        @media (max-width: 699px) {
            body { padding: 16px 12px; place-items: start center; }
            .game-card { padding: 17px 12px; }
            .game-meta { align-items: flex-start; flex-direction: column; }
            .stats { width: 100%; grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .stat { padding: 8px 5px; }
            .stat strong { font-size: 1.05rem; }
            .game-layout { grid-template-columns: minmax(0, 1fr) minmax(100px, 0.62fr); gap: 10px; }
            #gameContainer { width: 100%; }
            .sidebar { gap: 9px; }
            .side-panel { padding: 10px; }
            #nextCanvas { height: 72px; }
            .controls p { gap: 4px; font-size: 0.72rem; }
            .controls kbd { padding: 2px 4px; font-size: 0.64rem; }
            .action-bar { margin-top: 13px; }
            .action-bar button { flex: 1 1 calc(33.333% - 8px); min-width: 0; }
        }

        @media (max-width: 390px) {
            .topbar { gap: 8px; }
            #backBtn, #themeToggle { min-width: 0; }
            .game-layout { grid-template-columns: minmax(0, 1fr) 105px; }
            .panel-heading { align-items: flex-start; flex-direction: column; gap: 3px; }
            .controls p { display: block; line-height: 1.35; }
            .controls kbd { display: inline-block; margin-top: 3px; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <button id="backBtn" type="button">&larr; Home</button>
            <button id="themeToggle" type="button">&#9728; Light</button>
        </header>

        <main class="game-card">
            <section class="game-meta" aria-label="Tetris game information">
                <div>
                    <span class="eyebrow">Arcade classic</span>
                    <h1>Tetris</h1>
                </div>
                <div class="stats" aria-label="Game statistics">
                    <div class="stat"><span class="stat-label">Score</span><strong id="score">0</strong></div>
                    <div class="stat"><span class="stat-label">Best</span><strong id="highScore">0</strong></div>
                    <div class="stat"><span class="stat-label">Lines</span><strong id="lines">0</strong></div>
                    <div class="stat"><span class="stat-label">Level</span><strong id="level">1</strong></div>
                </div>
            </section>

            <section class="game-layout" aria-label="Tetris play area">
                <div id="gameContainer">
                    <canvas id="gameCanvas" width="200" height="400" aria-label="Tetris board"></canvas>
                    <div id="pauseOverlay" class="pause-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" aria-hidden="true">
                        <div class="pause-card">
                            <p>Game status</p>
                            <h2 id="pauseTitle">Paused</h2>
                            <button id="resumeBtn" type="button">Resume game</button>
                        </div>
                    </div>
                </div>

                <aside class="sidebar">
                    <section id="nextPiece" class="side-panel">
                        <div class="panel-heading">
                            <h2>Next piece</h2>
                            <span class="panel-label">Queue</span>
                        </div>
                        <canvas id="nextCanvas" width="100" height="100" aria-label="Next Tetris piece"></canvas>
                    </section>

                    <section class="controls side-panel">
                        <div class="panel-heading">
                            <h2>Controls</h2>
                            <span class="panel-label">Keyboard</span>
                        </div>
                        <p><span>Move</span><kbd>&larr; &rarr;</kbd></p>
                        <p><span>Soft drop</span><kbd>&darr;</kbd></p>
                        <p><span>Rotate</span><kbd>&uarr; / R</kbd></p>
                        <p><span>Hard drop</span><kbd>Space</kbd></p>
                        <p><span>Pause</span><kbd>P</kbd></p>
                    </section>
                </aside>
            </section>

            <div class="action-bar" aria-label="Game actions">
                <button id="resetBtn" type="button">Restart</button>
                <button id="pauseBtn" type="button">Pause</button>
                <button id="autoPlayBtn" type="button">Auto play</button>
                <button id="testBtn" type="button">Core tests</button>
            </div>

            <div class="mobile-controls" aria-label="Touch controls">
                <button id="qBtn" type="button"><span>Q</span><small>Reset</small></button>
                <button id="wBtn" type="button"><span>W</span><small>Drop</small></button>
                <button id="eBtn" type="button"><span>E</span><small>Rotate</small></button>
                <button id="rBtn" type="button"><span>R</span><small>Pause</small></button>
                <button id="aBtn" type="button"><span>A</span><small>Left</small></button>
                <button id="sBtn" type="button"><span>S</span><small>Down</small></button>
                <button id="dBtn" type="button"><span>D</span><small>Right</small></button>
            </div>
        </main>
    </div>

    <div id="testResults">
        <h2>Tetris Core Tests</h2>
        <div id="testResultsContent"></div>
        <div class="summary" id="testSummary"></div>
        <button id="closeTestBtn">Close</button>
    </div>

    <script type="module" src="./tetris-core.js"></script>
    <script type="module">
        import { createBoard, createPiece, rotateMatrix, isValidMove, placePiece, clearLines, TETROMINOES, COLS, ROWS } from './tetris-core.js';

        const testBtn = document.getElementById('testBtn');
        const testResults = document.getElementById('testResults');
        const testResultsContent = document.getElementById('testResultsContent');
        const testSummary = document.getElementById('testSummary');
        const closeTestBtn = document.getElementById('closeTestBtn');

        let passed = 0;
        let failed = 0;

        function report(name, condition) {
            const node = document.createElement('div');
            node.textContent = `${condition ? 'PASS' : 'FAIL'}: ${name}`;
            node.className = condition ? 'pass' : 'fail';
            testResultsContent.appendChild(node);
            if (condition) passed += 1; else failed += 1;
        }

        function runTests() {
            testResultsContent.innerHTML = '';
            passed = 0;
            failed = 0;

            report('createPiece returns centered piece', () => {
                const piece = createPiece(0);
                return piece.shape && piece.x === Math.floor(COLS / 2) - Math.floor(piece.shape[0].length / 2);
            });

            report('rotateMatrix rotates T correctly', () => {
                const rotated = rotateMatrix(TETROMINOES[2]);
                return rotated[0][1] === 1 && rotated[1][0] === 1 && rotated[1][1] === 1 && rotated[1][2] === 1;
            });

            report('isValidMove rejects wall collision', () => {
                const board = createBoard();
                const piece = createPiece(0);
                piece.x = -1;
                return !isValidMove(board, piece, piece.x, piece.y);
            });

            report('isValidMove detects piece collision', () => {
                const board = createBoard();
                board[0][5] = 1;
                const piece = createPiece(2);
                piece.x = 4;
                piece.y = 0;
                return !isValidMove(board, piece, piece.x, piece.y);
            });

            report('placePiece updates board cells', () => {
                const board = createBoard();
                const piece = createPiece(4);
                piece.x = 0;
                piece.y = 0;
                placePiece(board, piece);
                return board[0][0] === piece.color && board[0][1] === piece.color;
            });

            report('clearLines removes completed rows', () => {
                const board = createBoard();
                board[ROWS - 1] = Array(COLS).fill(1);
                const cleared = clearLines(board);
                return cleared === 1 && board[0].every(cell => cell === 0) && board[ROWS - 1].every(cell => cell === 0);
            });

            testSummary.textContent = `Results: ${passed} passed, ${failed} failed.`;
        }

        testBtn.addEventListener('click', () => {
            testResults.style.display = 'block';
            runTests();
        });

        closeTestBtn.addEventListener('click', () => {
            testResults.style.display = 'none';
        });
    </script>
</body>
</html>
