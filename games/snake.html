<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Sovereign</title>
  <style>
    :root {
      --bg-1: #0e1220;
      --bg-2: #171d2f;
      --panel: rgba(15, 19, 31, 0.9);
      --panel-border: rgba(143, 170, 255, 0.5);
      --text: #edf3ff;
      --muted: #b4bfd7;
      --board-dark: #3a2c50;
      --board-light: #d7c8aa;
      --accent: #7ae7cf;
      --accent-strong: #53c7ff;
      --gold: #f7d66d;
      --danger: #ff6b6b;
      --shadow: rgba(17, 24, 39, 0.7);
    }

    body.light-mode {
      --bg-1: #f1f7f1;
      --bg-2: #dfeee0;
      --panel: rgba(255, 255, 255, 0.96);
      --panel-border: rgba(79, 116, 88, 0.38);
      --text: #1b2a20;
      --muted: #4d6257;
      --board-dark: #bfd5b6;
      --board-light: #f8faf6;
      --accent: #2f7c6d;
      --accent-strong: #b77b3a;
      --gold: #b4800d;
      --danger: #c64a4a;
      --shadow: rgba(40, 62, 48, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(circle at top, rgba(118, 200, 164, 0.18), transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background 0.25s ease, color 0.25s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-shell {
      width: min(100%, 860px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .home-link {
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      transition: color 0.2s ease;
    }

    .home-link:hover {
      color: var(--text);
    }

    .toggle-button,
    .mini-button,
    .dpad button {
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .toggle-button {
      padding: 0.7rem 1rem;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    .toggle-button:hover,
    .mini-button:hover {
      transform: translateY(-1px);
      border-color: rgba(122, 231, 207, 0.75);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
    }

    .dpad button:hover {
      border-color: rgba(122, 231, 207, 0.75);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
    }

    .game-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 26px;
      padding: 22px 18px 18px;
      box-shadow: 0 30px 60px var(--shadow);
      backdrop-filter: blur(12px);
    }

    .game-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 18px;
    }

    .eyebrow {
      display: inline-block;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.68rem;
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .scoreboard {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .score-pill {
      min-width: 108px;
      padding: 0.7rem 0.9rem;
      border-radius: 16px;
      background: rgba(122, 231, 207, 0.08);
      border: 1px solid rgba(122, 231, 207, 0.4);
      text-align: center;
    }

    .score-pill span {
      display: block;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .score-pill strong {
      font-size: 1.5rem;
      letter-spacing: -0.04em;
    }

    .board-shell {
      position: relative;
      max-width: 440px;
      margin: 0 auto;
      border-radius: 22px;
      padding: 12px;
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
      border: 2px solid rgba(32, 29, 26, 0.68);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.18), 0 16px 28px rgba(17, 24, 39, 0.18);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 16px;
      background: var(--board-dark);
      border: none;
      box-shadow: inset 0 0 0 3px rgba(17, 24, 39, 0.15), 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .overlay {
      position: absolute;
      inset: 12px;
      display: grid;
      place-items: center;
      background: rgba(9, 12, 18, 0.18);
      border-radius: 16px;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.2s ease;
    }

    body.light-mode .overlay {
      background: rgba(255, 255, 255, 0.22);
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: min(80%, 260px);
      padding: 1.1rem 1rem;
      border-radius: 18px;
      background: rgba(15, 19, 31, 0.88);
      border: 1px solid rgba(122, 231, 207, 0.45);
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    body.light-mode .overlay-card {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(108, 92, 72, 0.35);
      box-shadow: 0 18px 40px rgba(82, 67, 55, 0.12);
    }

    .overlay-card p {
      color: var(--muted);
      letter-spacing: 0.14em;
      font-size: 0.68rem;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .overlay-card h2 {
      margin-bottom: 0.85rem;
      font-size: 1.8rem;
      letter-spacing: -0.04em;
    }

    .mini-button {
      padding: 0.7rem 1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #f9fafb;
      border: 0;
      font-weight: 700;
    }

    body.light-mode .mini-button {
      background: linear-gradient(135deg, #2f7c6d, #8ccf9a);
      color: #f6f1ea;
    }

    .control-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .mini-button {
      min-width: 120px;
    }

    .controls {
      display: flex;
      justify-content: center;
    }

    .dpad {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
    }

    .dpad button {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 1.5rem;
      background: linear-gradient(145deg, rgba(122, 231, 207, 0.15), rgba(83, 199, 255, 0.12));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    .dpad .up { top: 0; left: 50%; transform: translateX(-50%); }
    .dpad .down { bottom: 0; left: 50%; transform: translateX(-50%); }
    .dpad .left { left: 0; top: 50%; transform: translateY(-50%); }
    .dpad .right { right: 0; top: 50%; transform: translateY(-50%); }

    @media (max-width: 620px) {
      .game-meta {
        flex-direction: column;
        align-items: flex-start;
      }

      .scoreboard {
        justify-content: flex-start;
      }

      .game-card {
        padding-left: 12px;
        padding-right: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a href="/" class="home-link">← Home</a>
      <button id="themeToggle" class="toggle-button" type="button">Light board</button>
    </header>

    <main class="game-card">
      <div class="game-meta">
        <div>
          <span class="eyebrow">Royal arcade</span>
          <h1>Snake Sovereign</h1>
        </div>

        <div class="scoreboard">
          <div class="score-pill">
            <span>Score</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="score-pill">
            <span>Best</span>
            <strong id="highScore">0</strong>
          </div>
        </div>
      </div>

      <div class="board-shell">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <p>Arcade status</p>
            <h2 id="overlayTitle">Ready</h2>
            <button id="startBtn" class="mini-button" type="button">Start game</button>
          </div>
        </div>
      </div>

      <div class="control-bar">
        <button id="pauseBtn" class="mini-button" type="button">Pause</button>
        <button id="restartBtn" class="mini-button" type="button">Restart</button>
      </div>

      <div class="controls">
        <div class="dpad" aria-label="Game controls">
          <button class="up" data-dir="ArrowUp" type="button" aria-label="Move up">▲</button>
          <button class="left" data-dir="ArrowLeft" type="button" aria-label="Move left">◀</button>
          <button class="right" data-dir="ArrowRight" type="button" aria-label="Move right">▶</button>
          <button class="down" data-dir="ArrowDown" type="button" aria-label="Move down">▼</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const scoreValue = document.getElementById('scoreValue');
    const highScoreEl = document.getElementById('highScore');
    const themeToggle = document.getElementById('themeToggle');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    function getBoardColors() {
      const rootStyles = getComputedStyle(document.body);
      return {
        dark: rootStyles.getPropertyValue('--board-dark').trim(),
        light: rootStyles.getPropertyValue('--board-light').trim()
      };
    }

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let highScore;
    let isRunning;
    let isPaused;
    let lastFrameTime;
    let tickMs;

    function setupNewGame() {
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 }
      ];
      food = { x: 14, y: 10 };
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      isRunning = false;
      isPaused = false;
      lastFrameTime = 0;
      tickMs = 170;
      updateScore();
      placeFood();
      drawGame();
      overlay.classList.remove('hidden');
      overlayTitle.textContent = 'Ready';
      startBtn.textContent = 'Start game';
      pauseBtn.textContent = 'Pause';
    }

    function updateScore() {
      scoreValue.textContent = score;
      highScoreEl.textContent = highScore;
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
    }

    function startGame() {
      if (overlayTitle.textContent === 'Game over') {
        return;
      }

      if (isPaused) {
        isPaused = false;
        pauseBtn.textContent = 'Pause';
        startBtn.textContent = 'Start game';
        overlay.classList.add('hidden');
        overlayTitle.textContent = 'Running';
        lastFrameTime = 0;
        return;
      }

      if (!isRunning) {
        isRunning = true;
        overlay.classList.add('hidden');
        overlayTitle.textContent = 'Running';
      }
      lastFrameTime = 0;
    }

    function beginFreshGame() {
      setupNewGame();
      startGame();
    }

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Continue game' : 'Pause';

      if (isPaused) {
        overlay.classList.remove('hidden');
        overlayTitle.textContent = 'Paused';
        startBtn.textContent = 'Continue game';
      } else {
        overlay.classList.add('hidden');
        overlayTitle.textContent = 'Running';
        startBtn.textContent = 'Start game';
      }
    }

    function endGame() {
      isRunning = false;
      isPaused = false;
      overlay.classList.remove('hidden');
      overlayTitle.textContent = 'Game over';
      startBtn.textContent = 'Restart game';
      pauseBtn.textContent = 'Pause';
      drawGame();
    }

    function setDirection(key) {
      if (overlayTitle.textContent === 'Game over') {
        return;
      }

      const moveMap = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }
      };

      const next = moveMap[key];
      if (!next) return;

      const isReverse = next.x === -direction.x && next.y === -direction.y;
      if (!isReverse) {
        nextDirection = next;
      }

      if (!isRunning && !isPaused && overlayTitle.textContent !== 'Game over') {
        startGame();
      }
    }

    function updateGame() {
      if (!isRunning || isPaused) return;

      direction = nextDirection;
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
      const hitBody = snake.some(segment => segment.x === head.x && segment.y === head.y);

      if (hitWall || hitBody) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        highScore = Number(localStorage.getItem('highScore')) || 0;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('highScore', String(highScore));
        }
        updateScore();
        tickMs = Math.max(80, 170 - score * 0.9);
        placeFood();
      } else {
        snake.pop();
      }
    }

    function drawCheckerboard() {
      const { dark, light } = getBoardColors();
      for (let y = 0; y < tileCount; y++) {
        for (let x = 0; x < tileCount; x++) {
          const color = (x + y) % 2 === 0 ? light : dark;
          ctx.fillStyle = color;
          ctx.fillRect(x * gridSize, y * gridSize, gridSize, gridSize);
        }
      }
    }

    function drawFood() {
      const size = gridSize * 0.58;
      const px = food.x * gridSize + gridSize / 2;
      const py = food.y * gridSize + gridSize / 2;

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#dc2626';
      ctx.shadowColor = 'rgba(220, 38, 38, 0.9)';
      ctx.shadowBlur = 18;
      ctx.fillRect(-size / 2, -size / 2, size, size);
      ctx.restore();

      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.arc(px, py - size * 0.15, size * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSnake() {
      snake.forEach((segment, index) => {
        const px = segment.x * gridSize + 1;
        const py = segment.y * gridSize + 1;
        const w = gridSize - 2;
        const h = gridSize - 2;

        const hueShift = index === 0 ? '#7ae7cf' : '#53c7ff';
        const shade = index === 0 ? '#7ae7cf' : index % 2 === 0 ? '#53c7ff' : '#7ab8ff';

        ctx.fillStyle = hueShift;
        ctx.fillRect(px, py, w, h);

        ctx.fillStyle = shade;
        ctx.fillRect(px + 4, py + 4, w - 8, h - 8);

        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 1.5, py + 1.5, w - 3, h - 3);
      });
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCheckerboard();
      drawFood();
      drawSnake();
    }

    function gameLoop(currentTime) {
      if (lastFrameTime === 0) lastFrameTime = currentTime;
      const elapsed = currentTime - lastFrameTime;

      if (elapsed >= tickMs) {
        lastFrameTime = currentTime;
        updateGame();
        drawGame();
      }

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', event => {
      if (event.key === ' ') {
        event.preventDefault();
        if (isRunning && !isPaused) {
          togglePause();
        } else if (isRunning && isPaused) {
          togglePause();
        } else {
          startGame();
        }
        return;
      }

      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
        event.preventDefault();
        setDirection(event.key);
      }
    });

    document.querySelectorAll('.dpad button').forEach(button => {
      const dir = button.dataset.dir;
      button.addEventListener('click', () => setDirection(dir));
      button.addEventListener('touchstart', event => {
        event.preventDefault();
        setDirection(dir);
      });
    });

    startBtn.addEventListener('click', () => {
      if (overlayTitle.textContent === 'Game over') {
        beginFreshGame();
        return;
      }

      if (overlayTitle.textContent === 'Paused') {
        togglePause();
        return;
      }

      startGame();
    });

    pauseBtn.addEventListener('click', () => {
      if (!isRunning) return;
      togglePause();
    });

    restartBtn.addEventListener('click', () => {
      beginFreshGame();
    });

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      themeToggle.textContent = document.body.classList.contains('light-mode') ? 'Dark board' : 'Light board';
      drawGame();
    });

    highScore = Number(localStorage.getItem('highScore')) || 0;
    updateScore();
    setupNewGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
